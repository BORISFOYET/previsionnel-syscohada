services:
  - type: web
    name: accounts-previsionnel
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /sante
    envVars:
      - key: CHARIOW_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: URL_BOUTIQUE
        sync: false
      - key: MARQUE
        value: "Réalisé avec Account's"
